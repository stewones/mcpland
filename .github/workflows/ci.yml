name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Run tests
      run: bun run test

    - name: Run tests with coverage
      run: bun run test:coverage

    # - name: Prepare coverage report in markdown
    #   if: github.event_name == 'pull_request'
    #   id: coverage
    #   uses: fingerprintjs/action-coverage-report-md@v2
    #   with:
    #     textReportPath: './coverage.txt'
    #     srcBasePath: './src'

    # - name: Comment coverage report on PR
    #   if: github.event_name == 'pull_request'
    #   uses: marocchino/sticky-pull-request-comment@v2
    #   with:
    #     message: ${{ steps.coverage.outputs.markdownReport }}
    #     header: Coverage Report

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: mcpland-coverage
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
        comment: false

    - name: Generate badges
      if: github.ref == 'refs/heads/main'
      run: bun run ./scripts/badges.ts

    - name: Commit badges
      if: github.ref == 'refs/heads/main'
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add assets/*.svg
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "update badges [skip ci]"
          git push origin main
        fi
